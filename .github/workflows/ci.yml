name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式检查
        run: pnpm format:check

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # 带覆盖率运行：vitest 会在覆盖率低于 thresholds 时失败，从而拦截覆盖率倒退。
      # 不可只跑 pnpm test——它不带 --coverage，门槛不会生效。
      - name: 单元测试与覆盖率
        run: pnpm test:coverage

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/editor/coverage/coverage-final.json
          retention-days: 7

      # 变异测试：stryker 在总分低于 thresholds.break 时返回非零，拦截测试有效性倒退。
      - name: 变异测试
        run: pnpm test:mutation

      - name: 构建
        run: pnpm build
